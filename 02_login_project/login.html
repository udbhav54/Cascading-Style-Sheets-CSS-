<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #1a1a1a;
      margin: 0;
      padding: 0;
      height: 100vh; /** Full viewport height(if we are watching on small and big screens i want all height of a screen) **/
      display: flex;
      justify-content: center;
      align-items: center;
    }

    h2 {
      color: #1a50a0;
      text-align: center;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input {
      margin-bottom: 50px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid black;;
      background-color: #d8d8d8;
    }

    .card {
      background-color: #dfdfdf;
      border-radius: 8px;
      padding: 30px;
      width: 300px;
    }

    button {
      background-color: #1b81da;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
    }
    button:hover {
      background-color: #1a50a0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login</h2>
    <form>
      <input type="email" name="" id="" placeholder="Email">
      <input type="password" name="" id="" placeholder="Password">
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
